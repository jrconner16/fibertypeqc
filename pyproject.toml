[project]
name = "fibertypeqc"
version = "0.1.0a0"
description = "Alpha workflow for muscle fiber segmentation, fiber typing, QC review, and CSV export."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<2.1",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-image>=0.22",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tifffile>=2024.5.22",
  "czifile>=2019.7.2",
  "imagecodecs>=2024.1.1",
  "roifile>=2024.5.24",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "napari[all]>=0.5",
  "magicgui>=0.8",
  "cellpose>=3.0",
  "xgboost>=2.1",
  "ruff>=0.15.10",
]

[project.optional-dependencies]
segmentation = [
  "torch",
  "torchvision",
]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "src/check_mergeability.py",
  "src/pseudo_label_merge.py",
  "src/train_classifier.py",
  "src/train_gold_classifier.py",
  "src/ui_napari.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
