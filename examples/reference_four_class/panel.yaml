# Synthetic four-marker panel: IIx is inferred from absent I, IIa, and IIb signal.
channels:
  laminin: 2
  dapi: null
  type_i: 0
  type_iia: 1
  type_iib: 3
  type_iix: null
  emhc: null
classification:
  residual_inference:
    enabled: true
    target_class: iix
    requires_negative_markers:
    - i
    - iia
    - iib
