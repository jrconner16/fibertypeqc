# Four-marker panel: Type I, IIa, laminin, IIb in channels 0-3. IIx is inferred from absent
# I, IIa, and IIb signal. Works with the default model quad_four_class_rf_v1.
channels:
  laminin: 2
  dapi: null
  type_i: 0
  type_iia: 1
  type_iib: 3
  type_iix: null
  emhc: null

classification:
  residual_inference:
    enabled: true
    target_class: iix
    requires_negative_markers: [i, iia, iib]
