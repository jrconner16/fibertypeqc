# Three-marker panel: IIb, IIa, laminin in channels 0-2. IIx is inferred from absent IIa and IIb
# signal. Works with the historical model rebaseline_tile_v2_p75p90_iib_iia_iix.
channels:
  laminin: 2
  dapi: null
  type_i: null
  type_iia: 1
  type_iib: 0
  type_iix: null
  emhc: null

classification:
  residual_inference:
    enabled: true
    target_class: iix
    requires_negative_markers: [iia, iib]
